version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexora_postgres
    restart: always
    environment:
      POSTGRES_USER: nexora_user
      POSTGRES_PASSWORD: nexora_password
      POSTGRES_DB: nexora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora_user -d nexora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://nexora_user:nexora_password@postgres:5432/nexora_db?schema=public
      JWT_SECRET: nexora_erp_production_jwt_secret_key_2026
      JWT_EXPIRES_IN: 1d
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexora_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
